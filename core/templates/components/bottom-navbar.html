<nav class="dock absolute bg-neutral text-neutral-content" style="z-index: 1001;">
    <a href="{% url 'map' %}" class="{% if request.resolver_match.url_name == 'map' %}dock-active{% endif %}">
        <i class="fa-solid fa-location-dot"></i>
        <span class="dock-label">Map</span>
    </a>

    <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}dock-active{% endif %}">
        <i class="fa-solid fa-message"></i>
        <span class="dock-label">Chat</span>
    </a>

    <button type="button" onclick="openGeneralCamera()" class="flex flex-col items-center justify-center bg-transparent border-none text-neutral-content/70 hover:text-white cursor-pointer py-1">
        <i class="fa-solid fa-camera text-base"></i>
        <span class="dock-label text-[10px] mt-1 font-semibold uppercase tracking-wider">Camera</span>
    </button>
    <button type="button" onclick="openStoriesModal()" class="flex flex-col items-center justify-center bg-transparent border-none text-neutral-content/70 hover:text-white cursor-pointer py-1">
        <i class="fa-solid fa-user-group text-base"></i>
        <span class="dock-label text-[10px] mt-1 font-semibold uppercase tracking-wider">Stories</span>
    </button>
</nav>
